[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-clawfetch"
version = "0.2.0"
description = "llama-index tools clawfetch integration — pay-per-call web intelligence for AI agents (x402, USDC on Base)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llama-index", "clawfetch", "x402", "web-scraping", "ai-agents", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "clawfetch>=0.3.0,<0.4",
    "llama-index-core>=0.12,<0.15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://api.clawfetch.ai"

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.clawfetch"

[tool.llamahub.class_authors]
ClawFetchToolSpec = "clawfetch"

[tool.pytest.ini_options]
testpaths = ["tests"]
